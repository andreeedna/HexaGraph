[package]
name = "hexagraph"
description = "HexaGraph: open-source scientific graphing and statistics"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hexagraph"
path = "src/main.rs"

[dependencies]
hg-core.workspace = true
hg-plot.workspace = true
hg-stats.workspace = true
serde_json.workspace = true
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.31.1", features = ["svg"] }
rfd = "0.15.3"
arboard = { version = "3.4.1", default-features = false }
resvg = "0.45.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "tiff"] }

# Files opened from the Finder (double-click on .hxn) arrive as Apple events (src/macos.rs).
# Same versions winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = ["block2", "NSArray", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder"] }

# Embeds the app and document icons in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
